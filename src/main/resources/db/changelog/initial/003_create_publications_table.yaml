databaseChangeLog:
  - changeSet:
      id: 003-create-publications-table
      author: Melkor
      changes:
        - createTable:
            tableName: publications
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: photo
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: owner
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: likes
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: comments
                  type: integer
                  constraints:
                    nullable: false